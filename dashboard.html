<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last.fm Radio — LeonMehmetiFM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red:       #d51007;
    --red-dim:   #a00c05;
    --red-glow:  rgba(213,16,7,0.18);
    --bg:        #0d0d0d;
    --surface:   #161616;
    --surface2:  #1f1f1f;
    --border:    #2a2a2a;
    --text:      #e8e8e8;
    --muted:     #777;
    --muted2:    #444;
    --font-head: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(10px);
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-head);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--red);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted2);
    transition: background 0.3s;
  }

  .live-dot.active {
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ── LAYOUT ── */
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 64px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
  }

  .col-main { display: flex; flex-direction: column; gap: 20px; }
  .col-side  { display: flex; flex-direction: column; gap: 20px; }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-title {
    font-family: var(--font-head);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-body { padding: 20px; }

  /* ── NOW PLAYING ── */
  .now-playing-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .now-playing-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--red);
  }

  .np-inner {
    padding: 24px;
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .np-art {
    width: 80px;
    height: 80px;
    border-radius: 6px;
    background: var(--surface2);
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .np-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .np-art-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--muted2);
  }

  .np-info { flex: 1; min-width: 0; }

  .np-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 6px;
  }

  .np-title {
    font-family: var(--font-head);
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }

  .np-artist {
    font-size: 13px;
    color: var(--muted);
  }

  /* ── PLAYER ── */
  .player-wrap {
    padding: 0 24px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .play-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--red);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .play-btn:hover { background: var(--red-dim); transform: scale(1.05); }

  .play-btn svg { width: 16px; height: 16px; fill: #fff; }

  .volume-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
  }

  .vol-icon { color: var(--muted); font-size: 14px; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--red);
    cursor: pointer;
  }

  /* ── SCROBBLES ── */
  .scrobble-list { list-style: none; }

  .scrobble-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .scrobble-item:last-child { border-bottom: none; }

  .scrobble-img {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    background: var(--surface2);
    object-fit: cover;
    flex-shrink: 0;
  }

  .scrobble-img-placeholder {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted2);
    font-size: 14px;
    flex-shrink: 0;
  }

  .scrobble-info { flex: 1; min-width: 0; }

  .scrobble-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scrobble-artist {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scrobble-now {
    font-size: 10px;
    font-weight: 600;
    color: var(--red);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* ── LIBRARY ── */
  .library-search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }

  .library-search input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    flex: 1;
  }

  .library-search input::placeholder { color: var(--muted2); }
  .library-search svg { width: 14px; height: 14px; fill: var(--muted2); flex-shrink: 0; }

  .library-list {
    list-style: none;
    max-height: 400px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .library-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }

  .library-item:last-child { border-bottom: none; }

  .library-item-info { min-width: 0; flex: 1; }

  .library-item-title {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .library-item-artist {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .library-item-playing {
    font-size: 10px;
    color: var(--red);
    font-weight: 600;
    flex-shrink: 0;
  }

  .library-count {
    font-size: 11px;
    color: var(--muted);
  }

  /* ── USER CARD ── */
  .user-card-inner {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .user-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface2);
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid var(--red);
  }

  .user-avatar-placeholder {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .user-name {
    font-family: var(--font-head);
    font-size: 16px;
    font-weight: 700;
  }

  .user-scrobbles {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .user-scrobbles span {
    color: var(--red);
    font-weight: 600;
  }

  /* ── STATS ROW ── */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat-box {
    background: var(--surface2);
    border-radius: 8px;
    padding: 14px 16px;
    border: 1px solid var(--border);
  }

  .stat-value {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── LOADING ── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
  }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 768px) {
    .page { grid-template-columns: 1fr; }
    header { padding: 14px 16px; }
    .page { padding: 16px 12px 48px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">♫</div>
    Last.fm Radio
  </div>
  <div class="live-badge">
    <div class="live-dot" id="liveDot"></div>
    <span id="liveLabel">Connecting…</span>
  </div>
</header>

<div class="page">

  <!-- MAIN COLUMN -->
  <div class="col-main">

    <!-- NOW PLAYING -->
    <div class="now-playing-card">
      <div class="np-inner">
        <div class="np-art" id="npArt">
          <div class="np-art-placeholder">♪</div>
        </div>
        <div class="np-info">
          <div class="np-label">Now Playing</div>
          <div class="np-title" id="npTitle">—</div>
          <div class="np-artist" id="npArtist">—</div>
        </div>
      </div>
      <div class="player-wrap">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="volume-wrap">
          <span class="vol-icon">🔈</span>
          <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)">
        </div>
      </div>
    </div>

    <!-- LIBRARY -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Library</span>
        <span class="library-count" id="libraryCount">— tracks</span>
      </div>
      <div class="card-body">
        <div class="library-search">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          <input type="text" id="librarySearch" placeholder="Search tracks…" oninput="filterLibrary()">
        </div>
        <ul class="library-list" id="libraryList">
          <li class="empty-state">Loading library…</li>
        </ul>
      </div>
    </div>

  </div>

  <!-- SIDE COLUMN -->
  <div class="col-side">

    <!-- USER CARD -->
    <div class="card">
      <div class="card-body">
        <div class="user-card-inner" id="userCard">
          <div class="user-avatar-placeholder">L</div>
          <div>
            <div class="user-name">LeonMehmetiFM</div>
            <div class="user-scrobbles">Loading scrobbles…</div>
          </div>
        </div>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-row" id="statsRow">
      <div class="stat-box">
        <div class="stat-value" id="statTracks">—</div>
        <div class="stat-label">In Library</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="statScrobbles">—</div>
        <div class="stat-label">Scrobbles</div>
      </div>
    </div>

    <!-- RECENT SCROBBLES -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Recent Scrobbles</span>
      </div>
      <div class="card-body" style="padding: 4px 20px 12px;">
        <ul class="scrobble-list" id="scrobbleList">
          <li class="empty-state">Loading…</li>
        </ul>
      </div>
    </div>

  </div>
</div>

<audio id="radioAudio" preload="none"></audio>

<script>
const API   = "http://localhost:5100/api";
const STREAM = "http://localhost:8000/lastfmradio";

let audio       = document.getElementById("radioAudio");
let playing     = false;
let libraryData = [];
let currentNP   = "";

audio.src    = STREAM;
audio.volume = 0.8;

// ── PLAYER ──
function togglePlay() {
  if (playing) {
    audio.pause();
    audio.src = "";
    playing   = false;
    document.getElementById("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>';
  } else {
    audio.src = STREAM + "?t=" + Date.now();
    audio.play().catch(() => {});
    playing   = true;
    document.getElementById("playIcon").innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  }
}

function setVolume(v) {
  audio.volume = parseFloat(v);
  document.querySelector(".vol-icon").textContent = v > 0.5 ? "🔊" : v > 0 ? "🔈" : "🔇";
}

// ── NOW PLAYING ──
async function pollNowPlaying() {
  try {
    const r  = await fetch(API + "/now-playing");
    const d  = await r.json();
    const key = d.artist + d.title;

    if (key !== currentNP) {
      currentNP = key;
      document.getElementById("npTitle").textContent  = d.title  || "—";
      document.getElementById("npArtist").textContent = d.artist || "—";

      // try to get album art from scrobbles
      fetchArtForTrack(d.artist, d.title);
    }

    document.getElementById("liveDot").classList.add("active");
    document.getElementById("liveLabel").textContent = "Live";
    updateLibraryPlaying(d.title);
  } catch {
    document.getElementById("liveDot").classList.remove("active");
    document.getElementById("liveLabel").textContent = "Offline";
  }
}

async function fetchArtForTrack(artist, title) {
  // pull from recent scrobbles which have album art
  try {
    const r = await fetch(API + "/scrobbles");
    const d = await r.json();
    const match = d.find(t => t.artist === artist && t.title === title);
    const artEl = document.getElementById("npArt");
    if (match && match.image) {
      artEl.innerHTML = `<img src="${match.image}" alt="album art">`;
    } else if (d[0] && d[0].image) {
      artEl.innerHTML = `<img src="${d[0].image}" alt="album art">`;
    } else {
      artEl.innerHTML = `<div class="np-art-placeholder">♪</div>`;
    }
  } catch { /* silent */ }
}

// ── LIBRARY ──
async function pollLibrary() {
  try {
    const r = await fetch(API + "/library");
    libraryData = await r.json();
    document.getElementById("libraryCount").textContent = libraryData.length + " tracks";
    document.getElementById("statTracks").textContent   = libraryData.length;
    renderLibrary(libraryData);
  } catch { /* silent */ }
}

function renderLibrary(items) {
  const np  = document.getElementById("npTitle").textContent;
  const ul  = document.getElementById("libraryList");
  if (!items.length) {
    ul.innerHTML = '<li class="empty-state">No tracks yet.</li>';
    return;
  }
  ul.innerHTML = items.map(t => `
    <li class="library-item">
      <div class="library-item-info">
        <div class="library-item-title">${esc(t.title)}</div>
        <div class="library-item-artist">${esc(t.artist)}</div>
      </div>
      ${t.title === np ? '<span class="library-item-playing">▶</span>' : ''}
    </li>
  `).join("");
}

function filterLibrary() {
  const q = document.getElementById("librarySearch").value.toLowerCase();
  const filtered = libraryData.filter(t =>
    t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q)
  );
  renderLibrary(filtered);
}

function updateLibraryPlaying(title) {
  document.querySelectorAll(".library-item").forEach(li => {
    const t = li.querySelector(".library-item-title")?.textContent;
    const badge = li.querySelector(".library-item-playing");
    if (t === title) {
      if (!badge) {
        const span = document.createElement("span");
        span.className = "library-item-playing";
        span.textContent = "▶";
        li.appendChild(span);
      }
    } else if (badge) {
      badge.remove();
    }
  });
}

// ── SCROBBLES ──
async function pollScrobbles() {
  try {
    const r    = await fetch(API + "/scrobbles");
    const data = await r.json();
    const ul   = document.getElementById("scrobbleList");
    ul.innerHTML = data.map(t => `
      <li class="scrobble-item">
        ${t.image
          ? `<img class="scrobble-img" src="${t.image}" alt="">`
          : `<div class="scrobble-img-placeholder">♪</div>`}
        <div class="scrobble-info">
          <div class="scrobble-title">${esc(t.title)}</div>
          <div class="scrobble-artist">${esc(t.artist)}</div>
        </div>
        ${t.now ? '<span class="scrobble-now">Now</span>' : ''}
      </li>
    `).join("");
  } catch { /* silent */ }
}

// ── USER INFO ──
async function loadUser() {
  try {
    const r = await fetch(API + "/user");
    const u = await r.json();
    if (!u.name) return;

    const card = document.getElementById("userCard");
    const avatar = u.image
      ? `<img class="user-avatar" src="${u.image}" alt="${esc(u.name)}">`
      : `<div class="user-avatar-placeholder">${u.name[0].toUpperCase()}</div>`;

    card.innerHTML = `
      ${avatar}
      <div>
        <div class="user-name">${esc(u.name)}</div>
        <div class="user-scrobbles"><span>${Number(u.scrobbles).toLocaleString()}</span> scrobbles</div>
      </div>
    `;
    document.getElementById("statScrobbles").textContent =
      Number(u.scrobbles) > 999
        ? (Number(u.scrobbles) / 1000).toFixed(1) + "k"
        : u.scrobbles;
  } catch { /* silent */ }
}

function esc(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── INIT ──
pollNowPlaying();
pollLibrary();
pollScrobbles();
loadUser();

setInterval(pollNowPlaying,  5000);
setInterval(pollScrobbles,   30000);
setInterval(pollLibrary,     60000);
setInterval(loadUser,        300000);
</script>
</body>
</html>
